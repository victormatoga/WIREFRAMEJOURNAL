{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Site Title & Browser Favicon -->
    <title>The WireFrame Journal (WJ)</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">

    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="The WireFrame Journal (WJ)">
    <meta name="description" content="Stay updated with the latest news, coverage, and analysis on The WireFrame Journal.">

    <!-- Open Graph / Search & Social Media Branding -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wireframejournal.onrender.com/">
    <meta property="og:title" content="The WireFrame Journal (WJ)">
    <meta property="og:description" content="Stay updated with the latest news, coverage, and analysis on The WireFrame Journal.">
    <meta property="og:image" content="https://wireframejournal.onrender.com/static/images/logo.png">

    <!-- Twitter Card Branding -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://wireframejournal.onrender.com/">
    <meta property="twitter:title" content="The WireFrame Journal (WJ)">
    <meta property="twitter:description" content="Stay updated with the latest news, coverage, and analysis on The WireFrame Journal.">
    <meta property="twitter:image" content="https://wireframejournal.onrender.com/static/images/logo.png">

    <!-- CSS / Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar" style="background-color: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <div class="navbar-brand">
            <a href="{% url 'home' %}" style="color: #fff; text-decoration: none; font-weight: bold; font-size: 1.2rem;">
                The WireFrame Journal (WJ)
            </a>
        </div>

        <div class="navbar-menu">
            <!-- Only displayed for logged-in Staff / Admin Users -->
            {% if user.is_authenticated and user.is_staff %}
                <a href="/admin" class="btn-admin" style="background-color: #e50914; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: bold;">
                    ADMIN PORTAL
                </a>
            {% endif %}
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container" style="padding: 20px;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer style="text-align: center; padding: 20px; border-top: 1px solid #ccc; margin-top: 40px;">
        <p>&copy; {% now "Y" %} The WireFrame Journal (WJ). All rights reserved.</p>
    </footer>

</body>
</html>
